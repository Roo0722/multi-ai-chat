name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on pull requests (no secrets needed): make sure the web app builds.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the APK to a GitHub Release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Harden and version the Android project
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          GRADLE=android/app/build.gradle
          # Don't let API keys in SharedPreferences be included in cloud/adb backups
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$MANIFEST"
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          # Increasing versionCode so each build can be installed over the previous one
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" "$GRADLE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" "$GRADLE"
          grep -q "versionCode ${GITHUB_RUN_NUMBER}" "$GRADLE"

      - name: Copy app icons
        run: |
          RES=android/app/src/main/res
          cp public/icons/ic_launcher_mdpi.png     $RES/mipmap-mdpi/ic_launcher.png
          cp public/icons/ic_launcher_mdpi.png     $RES/mipmap-mdpi/ic_launcher_round.png
          cp public/icons/ic_launcher_hdpi.png     $RES/mipmap-hdpi/ic_launcher.png
          cp public/icons/ic_launcher_hdpi.png     $RES/mipmap-hdpi/ic_launcher_round.png
          cp public/icons/ic_launcher_xhdpi.png    $RES/mipmap-xhdpi/ic_launcher.png
          cp public/icons/ic_launcher_xhdpi.png    $RES/mipmap-xhdpi/ic_launcher_round.png
          cp public/icons/ic_launcher_xxhdpi.png   $RES/mipmap-xxhdpi/ic_launcher.png
          cp public/icons/ic_launcher_xxhdpi.png   $RES/mipmap-xxhdpi/ic_launcher_round.png
          cp public/icons/ic_launcher_xxxhdpi.png  $RES/mipmap-xxxhdpi/ic_launcher.png
          cp public/icons/ic_launcher_xxxhdpi.png  $RES/mipmap-xxxhdpi/ic_launcher_round.png
          rm -rf $RES/mipmap-anydpi-v26

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/nexus-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android/nexus-release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            --no-daemon

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # Push a tag like v1.0.0 to publish a permanent download on the Releases page
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
